apiVersion: 1
datasources:
  - name: SentinelAPI PostgreSQL
    uid: sentinel-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: sentinelapi
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: sentinelapi
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
