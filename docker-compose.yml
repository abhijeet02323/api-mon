services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/sentinelapi.db
    volumes:
      - sentinel-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-replace-me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-not-used-by-sqlite-demo}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
volumes:
  sentinel-data:
  grafana-data:
